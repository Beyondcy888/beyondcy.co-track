# Beyondcy automatic backup: every 2 days at 02:00 WIB
# whole database -> numbered SQL files + images -> DD-MM-YYYY.zip (password) -> Google Drive
# The script is scripts/backup/backup.sh. This repo is public: the log shows counts only.
name: Backup every 2 days

on:
  schedule:
    - cron: '0 19 */2 * *'   # 19:00 UTC = 02:00 WIB the next morning, on alternate days
  workflow_dispatch:          # "Run workflow" button: make a backup right now

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'Beyondcy888/beyondcy.co-track'   # never runs in forks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (PostgreSQL 17 client, 7-Zip, rclone)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common p7zip-full > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version
          rclone version | head -1

      - name: Back up and upload
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          BACKUP_ZIP_PASSWORD: ${{ secrets.BACKUP_ZIP_PASSWORD }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
          KEEP_DAYS: '30'
          DRIVE_FOLDER: BEYONDCY-TRACKER-BACKUP
        run: bash scripts/backup/backup.sh
