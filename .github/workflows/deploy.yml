# Deploys the tracker to GitHub Pages on every push to main.
#   Now:   https://beyondcy888.github.io/beyondcy.co-track/
#   Later: https://track.beyondcy.co (11_CONNECT_DOMAIN.md deletes the VITE_BASE_PATH line below)
# Needs: Settings → Pages → Source = GitHub Actions, and the repo secrets
# VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
name: Deploy tracker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the Supabase secrets are set
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repo secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions), then re-run this workflow. Without them the tracker opens as a blank page."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /beyondcy.co-track/   # remove when the domain is connected (file 11)
      - run: cp dist/index.html dist/404.html   # SPA deep links on GitHub Pages

      - name: Check the build has no secrets
        run: |
          if grep -rIlE "service_role|sb_secret_[A-Za-z0-9_-]{20,}" dist; then
            echo "::error::A Supabase secret / service_role key was found in the build"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
